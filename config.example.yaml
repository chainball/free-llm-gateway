# free-llm-gateway 配置样例
# API key 通过环境变量提供,不写在此文件。复制为 config.yaml 后按需调整。
#
# 环境变量:
#   GLM_API_KEY         智谱 BigModel API key (https://open.bigmodel.cn)
#   SILICONFLOW_API_KEY 硅基流动 API key (https://cloud.siliconflow.cn)

providers:
  glm:
    enabled: true
    base_url: https://open.bigmodel.cn/api/paas/v4
    models: [glm-4-flash]
    # 限速(保守,留余量,遵循官方免费政策):
    concurrency: 2      # ≤ 官方并发(智谱免费 30)
    rpm: 15             # 每分钟请求上限
    tpm: 100000         # 每分钟 token 上限
    max_retries: 3
    cooldown: 120       # 熔断冷却(秒)
    weight: 1
    # 多 key 轮换(可选,优先级高于 env):
    # keys: ["${GLM_API_KEY_1}", "${GLM_API_KEY_2}"]

  siliconflow:
    enabled: true
    base_url: https://api.siliconflow.cn/v1
    models: [Qwen/Qwen3-8B]   # 仅白名单非 DeepSeek 模型
    concurrency: 2
    rpm: 15
    tpm: 100000
    max_retries: 3
    cooldown: 120
    weight: 1
