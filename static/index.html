<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>free-llm-gateway 管理台</title>
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --border:#262b36; --fg:#e6e8ee; --muted:#8b93a3; --accent:#4f8cff; --ok:#2ecc71; --bad:#e74c3c; --warn:#f1c40f; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
    header { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
    header h1 { font-size:18px; margin:0; }
    header .sub { color:var(--muted); font-size:13px; }
    main { max-width:1000px; margin:0 auto; padding:24px; }
    section { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:24px; }
    h2 { margin:0 0 16px; font-size:15px; }
    table { width:100%; border-collapse:collapse; }
    th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); font-size:13px; }
    th { color:var(--muted); font-weight:500; }
    input[type=number] { width:72px; background:#0c0e12; border:1px solid var(--border); color:var(--fg); border-radius:6px; padding:4px 6px; }
    input[type=text], textarea { background:#0c0e12; border:1px solid var(--border); color:var(--fg); border-radius:6px; padding:8px; width:100%; font-family:ui-monospace,monospace; }
    textarea { min-height:140px; resize:vertical; }
    button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; font-size:13px; }
    button.ghost { background:transparent; border:1px solid var(--border); color:var(--fg); }
    button:hover { opacity:.9; }
    .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; }
    .badge.ok { background:rgba(46,204,113,.15); color:var(--ok); }
    .badge.bad { background:rgba(231,76,60,.15); color:var(--bad); }
    .badge.warn { background:rgba(241,196,15,.15); color:var(--warn); }
    .badge.muted { background:rgba(139,147,163,.15); color:var(--muted); }
    .row { display:flex; gap:12px; align-items:flex-start; }
    .grow { flex:1; }
    .mono { font-family:ui-monospace,monospace; font-size:12px; color:var(--muted); }
    .muted { color:var(--muted); }
    .mt { margin-top:12px; }
    code { background:#0c0e12; padding:1px 6px; border-radius:4px; font-size:12px; }
  </style>
</head>
<body>
  <header>
    <h1>free-llm-gateway</h1>
    <span class="sub">OpenAI 兼容网关 · 国内免费大模型</span>
  </header>
  <main>
    <section>
      <h2>Provider 接入</h2>
      <table id="providers">
        <thead><tr><th>名称</th><th>模型</th><th>key</th><th>启用</th><th>并发</th><th>RPM</th><th>TPM</th><th>状态</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section>
      <h2>批量任务 (OpenAI Batch)</h2>
      <div class="muted">每行一个请求,JSONL 格式:<code>{"custom_id":"1","method":"POST","url":"/v1/chat/completions","body":{"model":"auto","messages":[{"role":"user","content":"你好"}]}}</code></div>
      <div class="row mt">
        <div class="grow"><textarea id="batch-input" placeholder='{"custom_id":"1","body":{"model":"auto","messages":[{"role":"user","content":"你好"}]}}'></textarea></div>
        <div><button id="create-batch">提交批量</button></div>
      </div>
      <table id="batches" class="mt">
        <thead><tr><th>ID</th><th>状态</th><th>total/completed/failed</th><th>创建</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
